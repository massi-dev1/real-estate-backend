[project]
name = "real-estate-backend"
version = "0.1.0"
description = "Multi-tenant real estate agency platform — FastAPI backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "geoalchemy2>=0.16",
    "redis>=5.2",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.10",
    "httpx>=0.28",
    "structlog>=24.4",
    "uuid-utils>=0.10",
    "aiosmtplib>=5.1.2",
    "celery[redis]>=5.4",
    "boto3>=1.43.49",
    "pyvips[binary]>=3.1.1",
    "blurhash>=1.1.5",
    "icalendar>=7.2.0",
    "nh3>=0.2",
    "reportlab>=4.2",
    "dnspython>=2.7",
    "prometheus-client>=0.21",
    "sentry-sdk[celery,fastapi,sqlalchemy]>=2.20",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
    "opentelemetry-instrumentation-celery>=0.51b0",
    "cryptography>=49.0.0",
    "pyotp>=2.10.0",
    "authlib>=1.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "asgi-lifespan>=2.1",
    "boto3-stubs[s3]>=1.43.49",
    "pip-audit>=2.10.1",
    "bandit>=1.9.4",
    "pre-commit>=4.6.1",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.161.2",
    "factory-boy>=3.3.3",
    "testcontainers[minio,postgres,redis]>=4.13.3",
    "types-factory-boy>=0.4.1",
    "coverage[toml]>=7.15.2",
    "greenlet>=3.5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "C4",        # comprehensions
    "RUF",
    "ASYNC",
]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
# The env pins and the optional testcontainers bootstrap must run *before*
# anything imports app.core.config, so the imports genuinely cannot come
# first — that ordering is the file's whole job.
"tests/conftest.py" = ["E402"]
# factory_boy declares fields as class attributes; a list/dict default is the
# library's own idiom, and `ClassVar` would take them out of the declaration
# set factory_boy builds from.
"tests/factories.py" = ["RUF012"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# authlib ships no py.typed marker (verified), so its httpx OAuth client reads
# as untyped; it is confined to the single Google adapter.
module = [
    "geoalchemy2.*",
    "asyncpg.*",
    "celery.*",
    "pyvips.*",
    "blurhash.*",
    "reportlab.*",
    "authlib.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# celery ships no py.typed marker, so `@shared_task` (and the `@signal.connect`
# handlers in celery_app) are themselves untyped — strict mode would otherwise
# erase every decorated function's signature.
module = ["app.workers.tasks.*", "app.workers.celery_app"]
disallow_untyped_decorators = false

[tool.bandit]
# Scanned tree only; tests exercise deliberately-weak fixtures and are not
# shipped, so they stay out of the security gate.
exclude_dirs = ["tests"]
# Scoped waivers — each of these fires on an idiom this codebase uses
# deliberately, and rewriting the code to silence the checker would make it
# worse, not safer:
#   B101 assert_used — asserts are invariant guards after schema/DB validation
#       (`assert x is not None  # schema-validated`) that narrow types for
#       mypy strict. The runtime image never runs python -O, so they are live.
#   B105 hardcoded_password_string — fires on HMAC purpose-domain constants
#       (e.g. `_TOKEN_PURPOSE = "valuation-request"`), which are separation
#       labels, not secrets. Real secrets are config-only (§10.6).
#   B110 try_except_pass — the WebSocket relay's send-failure fall-through
#       (client gone → break to cleanup) is the intended control flow.
#   B406 import_xml_sax — flags `xml.sax.saxutils.escape`, which is the XML
#       *output escaping* used to build the sitemap/RSS/feed documents. It is
#       the defense, not a parser; no untrusted XML is ever parsed.
skips = ["B101", "B105", "B110", "B406"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["src/app"]
# SQLAlchemy's async layer runs service/repository code inside a greenlet
# (that is how `await` reaches a sync DBAPI driver). Without this, coverage's
# tracer never sees those frames and reports code the suite demonstrably
# exercises as unhit — `set_commission` measured 0% while its own test
# asserted on the derived amount. This is a measurement fix, not a gate tweak.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
# §13's ~85% gate. The suite currently measures 92% on modules/ + core/, so
# the threshold sits below where we are on purpose: it is a ratchet against
# regression, not a target to chase. Raising it to the current number would
# fail the build on any honest refactor that adds a defensive branch, which
# is how coverage gates start rewarding tests written for the metric.
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    # Type-checking-only imports never execute at runtime.
    "if TYPE_CHECKING:",
    # Protocol/ABC bodies declare a contract; there is nothing to run.
    "^\\s*\\.\\.\\.$",
    "raise NotImplementedError",
]

[tool.coverage.paths]
# CI checks out to a different absolute path than a dev machine; without this
# the two runs' data would not combine into one report.
source = ["src/app", "*/src/app"]
