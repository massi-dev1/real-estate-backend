# Local dev hooks (§15). Install once with:
#   uv run pre-commit install
#
# These mirror the fast half of the CI gate (.github/workflows/ci.yml) so a
# lint/type failure surfaces before the push, not after. Tests and the security
# scans deliberately stay CI-only — they need the docker stack and are too slow
# for a commit hook.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        # uv.lock is generated, must be committed in lockstep with
        # pyproject.toml for `uv sync --frozen`, and grows monotonically with
        # every dependency — it would eventually trip this hook on the one
        # commit that cannot be split.
        exclude: ^uv\.lock$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.7
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        # mypy needs the project's own dependencies to type-check imports;
        # pre-commit builds an isolated env, so every runtime dep that ships
        # type information (py.typed or stubs) has to be declared here. Deps
        # without type info are covered by the ignore_missing_imports override
        # in pyproject.toml instead (geoalchemy2, asyncpg, celery, pyvips,
        # blurhash, reportlab) and are deliberately absent.
        additional_dependencies:
          - "fastapi>=0.115"
          - "pydantic[email]>=2.10"
          - "pydantic-settings>=2.7"
          - "sqlalchemy[asyncio]>=2.0.36"
          - "alembic>=1.14"
          # Upper bound matches what the project actually resolves to: kombu
          # (via celery[redis], §12) pins redis<6.5, and auth/service.py has a
          # `type: ignore[misc]` for that version's smembers overload. Without
          # the bound this env installs redis 7+, where the ignore is unused
          # and mypy --strict fails on a warn_unused_ignores error the real
          # gate never sees.
          - "redis>=5.2,<6.5"
          - "pyjwt>=2.10"
          - "httpx>=0.28"
          - "structlog>=24.4"
          - "boto3-stubs[s3]>=1.43.49"
          - "icalendar>=7.2.0"
          - "nh3>=0.2"
          - "dnspython>=2.7"
          - "pwdlib[argon2]>=0.2"
          - "uuid-utils>=0.10"
          - "aiosmtplib>=5.1.2"
          # Observability (§14, Part 27). All three ship py.typed, so mypy
          # resolves them here rather than through ignore_missing_imports.
          - "prometheus-client>=0.21"
          - "sentry-sdk>=2.20"
          - "opentelemetry-sdk>=1.30"
          - "opentelemetry-exporter-otlp-proto-http>=1.30"
          # The instrumentation packages carry no py.typed of their own but
          # live under the typed `opentelemetry` namespace, so mypy needs them
          # installed to resolve the submodule imports at all.
          - "opentelemetry-instrumentation-fastapi>=0.51b0"
          - "opentelemetry-instrumentation-sqlalchemy>=0.51b0"
          - "opentelemetry-instrumentation-celery>=0.51b0"
          # Data protection (§10.7, Part 30) and MFA (§7.1, Part 29): both ship
          # py.typed, so their absence here was a real hook-only failure (the
          # project venv has them, the isolated env did not). authlib ships no
          # py.typed and is covered by ignore_missing_imports instead.
          - "cryptography>=49.0.0"
          - "pyotp>=2.10"
        args: ["--config-file=pyproject.toml"]
        pass_filenames: false
