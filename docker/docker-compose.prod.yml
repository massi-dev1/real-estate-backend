# Production application stack (§16), layered OVER docker-compose.yml.
#
# The base compose (docker-compose.yml) provides the backing services —
# Postgres/PostGIS, Redis, MinIO. This file adds the deployable app roles
# (api, worker, beat) and the Caddy edge. Run both together:
#
#   docker compose -f docker/docker-compose.yml \
#                  -f docker/docker-compose.prod.yml up -d --build
#
# One built image serves all three app roles; only the role command differs.
# Secrets come from the environment / an env file — never baked into the image.

name: real-estate-backend

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: real-estate-backend:latest
    command: ["api"]
    env_file:
      - ../.env
    environment:
      # Inside the compose network the backing services are reachable by their
      # service name, NOT localhost — these override the localhost-based URLs an
      # .env (copied from .env.example for local `uv run` dev) carries. In
      # Compose, `environment` wins over `env_file`, so secrets stay in .env
      # while the network topology is pinned here.
      APP_ENV: ${APP_ENV:-production}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app_user:app_password@db:5432/realestate}
      DATABASE_DDL_URL: ${DATABASE_DDL_URL:-postgresql+asyncpg://postgres:postgres@db:5432/realestate}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/2}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://minio:9000}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  worker:
    image: real-estate-backend:latest
    command: ["worker"]
    env_file:
      - ../.env
    environment:
      # Same network-topology overrides as the app role (see above) — the
      # worker reaches the backing services by service name, not localhost.
      APP_ENV: ${APP_ENV:-production}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app_user:app_password@db:5432/realestate}
      DATABASE_DDL_URL: ${DATABASE_DDL_URL:-postgresql+asyncpg://postgres:postgres@db:5432/realestate}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/2}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://minio:9000}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The worker never migrates; it waits for the api role to have done so.
      app:
        condition: service_started
    restart: unless-stopped

  beat:
    image: real-estate-backend:latest
    command: ["beat"]
    env_file:
      - ../.env
    environment:
      # beat only needs the broker/backend + DB, but it loads the same .env, so
      # the localhost hosts must be overridden to the compose service names too.
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app_user:app_password@db:5432/realestate}
      DATABASE_DDL_URL: ${DATABASE_DDL_URL:-postgresql+asyncpg://postgres:postgres@db:5432/realestate}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/2}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://minio:9000}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
